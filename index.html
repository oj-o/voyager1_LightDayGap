<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light-Day Gap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full-Screen Artwork Canvas: the piece itself, nothing else runs by default -->
  <canvas id="artCanvas"></canvas>

  <!-- Hidden until the pointer moves; auto-hides again after a few seconds -->
  <div class="bottom-toolbar">
    <div class="toolbar-card">
      <button id="btnPlayPause" class="ctrl-btn main-play">
        <span id="playIcon">PAUSE</span>
      </button>
      <button id="btnSound" class="ctrl-btn">
        <span id="soundIcon">SOUND ON</span>
      </button>
      <span id="timeLabel" class="time-label">00:00 / 05:00</span>
      <button id="btnExportVideo" class="ctrl-btn record-btn">
        <span id="recordIcon">EXPORT (5M)</span>
      </button>
    </div>
  </div>

  <!-- Minimal Progress Modal -->
  <div class="render-modal" id="renderModal">
    <div class="render-card">
      <div class="spinner"></div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="renderProgress"></div>
      </div>
      <span id="renderStatusText" class="status-num">0%</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
