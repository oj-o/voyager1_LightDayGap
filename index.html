<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light-Day Gap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Square fisheye dome master. No controls: this plays itself, once, for 300s. -->
  <canvas id="artCanvas"></canvas>

  <!-- Appears only if the hidden export shortcut (E) is used to produce the dome file -->
  <div class="render-modal" id="renderModal">
    <div class="render-card">
      <div class="spinner"></div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="renderProgress"></div>
      </div>
      <span id="renderStatusText" class="status-num">0%</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
