<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light-Day Gap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Square fisheye dome master. Plays itself, once, for 300s — no audience interaction needed.
       The panel below is a producer/preview tool only: hidden until the mouse moves,
       so it stays invisible during an actual dome show where no one touches a mouse. -->
  <canvas id="artCanvas"></canvas>

  <div class="dome-panel" id="domePanel">
    <div class="panel-card">
      <div class="chapters">
        <button class="chapter-btn" data-t="0">EARTH</button>
        <button class="chapter-btn" data-t="40">JUPITER</button>
        <button class="chapter-btn" data-t="80">SATURN</button>
        <button class="chapter-btn" data-t="130">COMETS</button>
        <button class="chapter-btn" data-t="180">HELIOPAUSE</button>
        <button class="chapter-btn" data-t="220">NOW</button>
        <button class="chapter-btn" data-t="270">FUTURE</button>
      </div>
      <select id="recordDuration" class="chapter-btn duration-select" title="Recording length">
        <option value="1">1M</option>
        <option value="5" selected>5M</option>
        <option value="10">10M</option>
        <option value="40">40M</option>
      </select>
      <button id="btnRecord" class="record-btn">● RECORD</button>
    </div>
  </div>

  <!-- Appears only while a recording (via the RECORD button) is in progress -->
  <div class="render-modal" id="renderModal">
    <div class="render-card">
      <div class="spinner"></div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="renderProgress"></div>
      </div>
      <span id="renderStatusText" class="status-num">0%</span>
      <div id="renderTimeText" class="time-num">00:00 / 00:00</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
