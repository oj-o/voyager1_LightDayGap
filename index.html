<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light-Day Gap - 1-Minute Generative Audiovisual Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full-Screen Generative Canvas -->
  <canvas id="artCanvas"></canvas>

  <!-- Bottom Floating Control Toolbar -->
  <div class="bottom-toolbar">
    <div class="toolbar-card">
      <button id="btnPlayPause" class="ctrl-btn main-play">
        <span id="playIcon">▶ 재생</span>
      </button>
      <button id="btnSound" class="ctrl-btn">
        <span id="soundIcon">🔊 사운드 켜기</span>
      </button>
      <button id="btnRandomize" class="ctrl-btn rand-btn">
        <span>🎲 새로운 변주 생성</span>
      </button>
      <button id="btnExportVideo" class="ctrl-btn record-btn">
        <span id="recordIcon">🎬 1분 영상 저장 (.webm)</span>
      </button>
    </div>
  </div>

  <!-- Render Progress Overlay during 1-Min Video Recording -->
  <div class="render-modal" id="renderModal">
    <div class="render-card">
      <div class="spinner"></div>
      <h3>1분 추상 미디어 아트 영상 녹화 중...</h3>
      <p>랜덤하게 생성된 시공간 그래픽과 사운드를 60초간 인코딩합니다.</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="renderProgress"></div>
      </div>
      <span id="renderStatusText">0%</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
